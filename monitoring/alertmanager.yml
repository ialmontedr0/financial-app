route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: critical
      repeat_interval: 1h

receivers:
  - name: default
    email_configs:
      - to: "{{ .Values.alert_email_to }}"
        from: "{{ .Values.alert_email_from }}"
        smarthost: "{{ .Values.smtp_host }}:{{ .Values.smtp_port }}"
        auth_username: "{{ .Values.smtp_user }}"
        auth_password: "{{ .Values.smtp_password }}"
        send_resolved: true

  - name: critical
    email_configs:
      - to: "{{ .Values.alert_email_to }}"
        from: "{{ .Values.alert_email_from }}"
        smarthost: "{{ .Values.smtp_host }}:{{ .Values.smtp_port }}"
        auth_username: "{{ .Values.smtp_user }}"
        auth_password: "{{ .Values.smtp_password }}"
        send_resolved: true
    slack_configs:
      - api_url: "{{ .Values.slack_webhook_url }}"
        channel: "#alerts"
        send_resolved: true
